<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Book Club Professional</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.7.3/sweetalert2.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;800&display=swap"
        rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">

    <style>
        .auth-page {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            padding: 50px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .auth-header i {
            font-size: 3.5rem;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .auth-header h2 {
            color: var(--primary-color);
            font-weight: 800;
            margin-bottom: 8px;
            font-size: 1.8rem;
        }

        .auth-header p {
            color: #6b7280;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .demo-credentials {
            background: linear-gradient(135deg, #ede9fe 0%, #fce7f3 100%);
            border-left: 5px solid var(--primary-color);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            font-size: 0.85rem;
        }

        .demo-credentials-title {
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 12px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .credential-item {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .credential-item .label {
            font-weight: 600;
            color: #374151;
            min-width: 100px;
        }

        .credential-item .value {
            background: white;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #e5e7eb;
            font-family: 'Courier New', monospace;
            color: var(--primary-color);
            font-weight: 600;
            word-break: break-all;
            flex: 1;
            font-size: 0.75rem;
        }

        .credential-item .copy-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .credential-item .copy-btn:hover {
            background: #4c1d95;
            transform: scale(1.1);
        }

        .password-requirements {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 0.8rem;
        }

        .password-requirements h5 {
            color: #92400e;
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .requirements-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .requirements-list li {
            color: #b45309;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .requirements-list li::before {
            content: "✓";
            display: inline-block;
            width: 18px;
            height: 18px;
            background: #fbbf24;
            border-radius: 50%;
            text-align: center;
            line-height: 18px;
            color: #92400e;
            font-weight: bold;
            font-size: 0.7rem;
            flex-shrink: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .form-control {
            border: 2px solid #e5e7eb;
            padding: 12px 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(30, 64, 175, 0.1);
            outline: none;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(30, 64, 175, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e5e7eb;
        }

        .divider span {
            background: white;
            padding: 0 10px;
            color: #9ca3af;
            position: relative;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .auth-link {
            text-align: center;
            margin-top: 20px;
        }

        .auth-link p {
            color: #6b7280;
            margin: 0;
            font-size: 0.9rem;
        }

        .auth-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 700;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

        .role-badge {
            display: inline-block;
            background: #dbeafe;
            color: var(--primary-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-left: 6px;
            letter-spacing: 0.3px;
        }

        .role-badge.admin {
            background: #fecaca;
            color: #991b1b;
        }
    </style>
</head>

<body>
    <div class="auth-page">
        <div class="auth-container">
            <!-- Header -->
            <div class="auth-header">
                <i class="fas fa-book-reader"></i>
                <h2>Book Club</h2>
                <p>Read Together. Share Insights. Grow as One.</p>
            </div>




            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="email">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input type="email" class="form-control" id="email" name="email"
                        placeholder="Enter your email address" autocomplete="email" required>
                </div>

                <div class="form-group position-relative mb-3">
                    <label class="form-label" for="loginPassword">
                        <i class="fas fa-lock"></i> Password
                    </label>

                    <div class="input-group">
                        <input type="password" class="form-control" id="loginPassword" name="loginPassword"
                            placeholder="Enter your password" autocomplete="current-password" required>

                        <span class="input-group-text" style="cursor:pointer;"
                            onclick="togglePasswordVisibility('loginPassword', this)">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>
                <!-- Forgot Password -->
                <div class="text-end mb-3">
                    <a href="#" class="text-decoration-none small">
                        <i class="fas fa-key"></i> Forgot Password?
                    </a>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-sign-in-alt"></i> Login Now
                </button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <div class="auth-link">
                <p>Don't have an account? <a href="register.html">Register here</a></p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.7.3/sweetalert2.min.js"></script>
    <script src="../assets/js/app.js"></script>

    <script>
        // ============================================================
        // SECURE CREDENTIALS (PK2KF Standard)
        // ============================================================



        // ============================================================
        // PASSWORD VALIDATION (PK2KF Standards)
        // ============================================================

        function validatePasswordStrength(password) {
            const requirements = {
                minLength: password.length >= 12,
                hasUppercase: /[A-Z]/.test(password),
                hasLowercase: /[a-z]/.test(password),
                hasNumber: /[0-9]/.test(password),
                hasSpecial: /[@#$%^&!*]/.test(password)
            };

            return {
                isValid: Object.values(requirements).every(req => req === true),
                requirements: requirements
            };
        }

        // ============================================================
        // COPY TO CLIPBOARD
        // ============================================================

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                Swal.fire({
                    icon: 'success',
                    title: 'Copied!',
                    text: 'Credential copied to clipboard',
                    timer: 1500,
                    showConfirmButton: false,
                    position: 'bottom-end'
                });
            }).catch(err => {
                console.error('Failed to copy:', err);
            });
        }

        // ============================================================
        // LOGIN HANDLER
        // ============================================================

        function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;

            // Get users from localStorage
            const users = JSON.parse(localStorage.getItem('allUsers')) || [];

            // Find user by email
            const user = users.find(u => String(u.email || '').toLowerCase() === email);

            if (!user) {
                Swal.fire({
                    icon: 'error',
                    title: 'Login Failed',
                    text: 'Email address not found',
                    confirmButtonColor: '#ef4444'
                });
                return;
            }

            // Validate password
            if (user.password !== password) {
                Swal.fire({
                    icon: 'error',
                    title: 'Login Failed',
                    text: 'Invalid password. Please try again.',
                    confirmButtonColor: '#ef4444'
                });
                return;
            }

            // Validate password meets PK2KF standards
            const passwordValidation = validatePasswordStrength(user.password);
            if (!passwordValidation.isValid) {
                console.warn('⚠️ Password does not meet security requirements');
            }

            // Successful login
            const userSession = {
                userId: user.userId,
                fullName: user.fullName,
                email: user.email,
                phone: user.phone,
                department: user.department,
                isAdmin: user.isAdmin
            };

            localStorage.setItem('currentUser', JSON.stringify(userSession));

            Swal.fire({
                icon: 'success',
                title: 'Login Successful!',
                html: `<strong>Welcome back, ${user.fullName}!</strong><br><small>${user.isAdmin ? 'Admin Access' : 'Member Access'}</small>`,
                confirmButtonColor: '#1e40af',
                timer: 2000,
                timerProgressBar: true
            }).then(() => {
                // Redirect based on role
                if (user.isAdmin) {
                    window.location.href = '../admin/dashboard.html';
                } else {
                    window.location.href = '../index.html';
                }
            });
        }

        // ============================================================
        // DOCUMENT READY
        // ============================================================

        document.addEventListener('DOMContentLoaded', function () {
            console.log('📚 Book Club - Secure Authentication System');
            console.log('Password Security Standard: PK2KF Compliant');
        });
    </script>

</body>

</html>
