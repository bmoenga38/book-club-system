<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Book Club Professional</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.7.3/sweetalert2.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;800&display=swap"
        rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">

    <style>
        .auth-page {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            padding: 50px;
            margin: 20px 0;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .auth-header i {
            font-size: 3.5rem;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .auth-header h2 {
            color: var(--primary-color);
            font-weight: 800;
            margin-bottom: 8px;
            font-size: 1.8rem;
        }

        .auth-header p {
            color: #6b7280;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .password-requirements {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 0.8rem;
        }

        .password-requirements h5 {
            color: #92400e;
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .requirements-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .requirements-list li {
            color: #b45309;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .requirements-list li::before {
            content: "✓";
            display: inline-block;
            width: 18px;
            height: 18px;
            background: #fbbf24;
            border-radius: 50%;
            text-align: center;
            line-height: 18px;
            color: #92400e;
            font-weight: bold;
            font-size: 0.7rem;
            flex-shrink: 0;
        }

        .requirements-list li.met::before {
            background: #10b981;
            color: white;
        }

        .requirements-list li.unmet::before {
            background: #ef4444;
            color: white;
            content: "✗";
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .form-control {
            border: 2px solid #e5e7eb;
            padding: 12px 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(30, 64, 175, 0.1);
            outline: none;
        }

        .form-control.is-valid {
            border-color: #10b981;
        }

        .form-control.is-invalid {
            border-color: #ef4444;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(30, 64, 175, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e5e7eb;
        }

        .divider span {
            background: white;
            padding: 0 10px;
            color: #9ca3af;
            position: relative;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .auth-link {
            text-align: center;
            margin-top: 20px;
        }

        .auth-link p {
            color: #6b7280;
            margin: 0;
            font-size: 0.9rem;
        }

        .auth-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 700;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

        .password-strength-meter {
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            transition: all 0.3s ease;
            border-radius: 4px;
        }

        .strength-weak {
            width: 33%;
            background: #ef4444;
        }

        .strength-medium {
            width: 66%;
            background: #f59e0b;
        }

        .strength-strong {
            width: 100%;
            background: #10b981;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .password-toggle:hover {
            color: var(--primary-color);
        }

        .position-relative {
            position: relative;
        }

        @media (max-width: 576px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .auth-container {
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>
    <div class="auth-page">
        <div class="auth-container">
            <!-- Header -->
            <div class="auth-header">
                <i class="fas fa-book-reader"></i>
                <h2>Book Club</h2>
                <p>Join Our Community of Readers</p>
            </div>

            <!-- Password Requirements -->
            <div class="password-requirements" id="passwordRequirements">
                <h5><i class="fas fa-shield-alt"></i> Password Requirements</h5>
                <ul class="requirements-list">
                    <li id="req-length">Minimum 12 characters</li>
                    <li id="req-uppercase">At least 1 UPPERCASE letter (A-Z)</li>
                    <li id="req-lowercase">At least 1 lowercase letter (a-z)</li>
                    <li id="req-number">At least 1 number (0-9)</li>
                    <li id="req-special">At least 1 special character (@#$%^&*)</li>
                </ul>
            </div>

            <!-- Registration Form -->
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="fullName">
                            <i class="fas fa-user"></i> Full Name
                        </label>
                        <input type="text" class="form-control" id="fullName" name="fullName" placeholder="John Doe"
                            required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="phone">
                            <i class="fas fa-phone"></i> Phone Number
                        </label>
                        <input type="tel" class="form-control" id="phone" name="phone" placeholder="254700000000"
                            pattern="[0-9]{12}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input type="email" class="form-control" id="email" name="email"
                        placeholder="your.email@example.com" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="department">
                        <i class="fas fa-building"></i> Department
                    </label>
                    <select class="form-control" id="department" name="department" required>
                        <option value="">Select Department</option>
                        <option value="Youth">Youth</option>
                        <option value="Men">Men</option>
                        <option value="Women">Women</option>
                        <option value="Children">Children</option>
                        <option value="Administration">Administration</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group position-relative">
                    <label class="form-label" for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" class="form-control" id="password" name="password"
                        placeholder="Create a strong password" autocomplete="new-password" required>
                    <i class="fas fa-eye password-toggle" id="togglePassword"
                        onclick="togglePasswordVisibility('password', 'togglePassword')"></i>
                    <div class="password-strength-meter">
                        <div class="password-strength-bar" id="passwordStrengthBar"></div>
                    </div>
                </div>

                <div class="form-group position-relative">
                    <label class="form-label" for="confirmPassword">
                        <i class="fas fa-lock"></i> Confirm Password
                    </label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                        placeholder="Re-enter your password" autocomplete="new-password" required>
                    <i class="fas fa-eye password-toggle" id="toggleConfirmPassword"
                        onclick="togglePasswordVisibility('confirmPassword', 'toggleConfirmPassword')"></i>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <div class="auth-link">
                <p>Already have an account? <a href="login.html">Login here</a></p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.7.3/sweetalert2.min.js"></script>

    <script>
        // ============================================================
        // PASSWORD VALIDATION (PK2KF Standards)
        // ============================================================

        function validatePasswordStrength(password) {
            const requirements = {
                minLength: password.length >= 12,
                hasUppercase: /[A-Z]/.test(password),
                hasLowercase: /[a-z]/.test(password),
                hasNumber: /[0-9]/.test(password),
                hasSpecial: /[@#$%^&*]/.test(password)
            };

            return {
                isValid: Object.values(requirements).every(req => req === true),
                requirements: requirements
            };
        }

        // ============================================================
        // PASSWORD STRENGTH INDICATOR
        // ============================================================

        document.getElementById('password').addEventListener('input', function () {
            const password = this.value;
            const validation = validatePasswordStrength(password);
            const strengthBar = document.getElementById('passwordStrengthBar');

            // Update requirement checklist
            document.getElementById('req-length').className = validation.requirements.minLength ? 'met' : 'unmet';
            document.getElementById('req-uppercase').className = validation.requirements.hasUppercase ? 'met' : 'unmet';
            document.getElementById('req-lowercase').className = validation.requirements.hasLowercase ? 'met' : 'unmet';
            document.getElementById('req-number').className = validation.requirements.hasNumber ? 'met' : 'unmet';
            document.getElementById('req-special').className = validation.requirements.hasSpecial ? 'met' : 'unmet';

            // Calculate strength
            const metRequirements = Object.values(validation.requirements).filter(r => r === true).length;

            if (metRequirements <= 2) {
                strengthBar.className = 'password-strength-bar strength-weak';
            } else if (metRequirements <= 4) {
                strengthBar.className = 'password-strength-bar strength-medium';
            } else {
                strengthBar.className = 'password-strength-bar strength-strong';
            }

            // Update input border
            if (validation.isValid) {
                this.classList.remove('is-invalid');
                this.classList.add('is-valid');
            } else {
                this.classList.remove('is-valid');
                if (password.length > 0) {
                    this.classList.add('is-invalid');
                }
            }
        });

        // ============================================================
        // PASSWORD VISIBILITY TOGGLE
        // ============================================================

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // ============================================================
        // CONFIRM PASSWORD VALIDATION
        // ============================================================

        document.getElementById('confirmPassword').addEventListener('input', function () {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;

            if (confirmPassword.length > 0) {
                if (password === confirmPassword) {
                    this.classList.remove('is-invalid');
                    this.classList.add('is-valid');
                } else {
                    this.classList.remove('is-valid');
                    this.classList.add('is-invalid');
                }
            }
        });

        // ============================================================
        // PHONE NUMBER FORMATTING
        // ============================================================

        document.getElementById('phone').addEventListener('input', function () {
            // Remove non-numeric characters
            let value = this.value.replace(/\D/g, '');

            // Ensure it starts with 254
            if (value.length > 0 && !value.startsWith('254')) {
                if (value.startsWith('0')) {
                    value = '254' + value.substring(1);
                } else if (value.startsWith('7')) {
                    value = '254' + value;
                }
            }

            this.value = value;
        });

        // ============================================================
        // REGISTRATION HANDLER
        // ============================================================

        function handleRegister(event) {
            event.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const phone = document.getElementById('phone').value.trim();
            const department = document.getElementById('department').value;

            // Validate passwords match
            if (password !== confirmPassword) {
                Swal.fire({
                    icon: 'error',
                    title: 'Password Mismatch',
                    text: 'Passwords do not match. Please try again.',
                    confirmButtonColor: '#ef4444'
                });
                return;
            }

            // Validate password strength
            const passwordValidation = validatePasswordStrength(password);
            if (!passwordValidation.isValid) {
                Swal.fire({
                    icon: 'error',
                    title: 'Weak Password',
                    text: 'Password does not meet security requirements. Please check all requirements.',
                    confirmButtonColor: '#ef4444'
                });
                return;
            }

            // Validate phone number
            if (phone.length !== 12 || !phone.startsWith('254')) {
                Swal.fire({
                    icon: 'error',
                    title: 'Invalid Phone Number',
                    text: 'Phone number must be in format: 254700000000',
                    confirmButtonColor: '#ef4444'
                });
                return;
            }

            // Get existing users
            const users = JSON.parse(localStorage.getItem('allUsers')) || [];

            // Check if email already exists
            if (users.some(u => u.email === email)) {
                Swal.fire({
                    icon: 'error',
                    title: 'Email Already Registered',
                    text: 'This email address is already registered. Please login instead.',
                    confirmButtonColor: '#ef4444'
                });
                return;
            }

            // Create new user
            const newUser = {
                userId: users.length + 1,
                fullName: fullName,
                email: email,
                password: password,
                phone: phone,
                department: department,
                isAdmin: false,
                registeredAt: new Date().toISOString()
            };

            // Add user to array
            users.push(newUser);

            // Save to localStorage
            localStorage.setItem('allUsers', JSON.stringify(users));

            // Success message
            Swal.fire({
                icon: 'success',
                title: 'Registration Successful!',
                html: `<strong>Welcome to Book Club, ${fullName}!</strong><br><small>You can now login with your credentials</small>`,
                confirmButtonColor: '#10b981',
                confirmButtonText: 'Go to Login'
            }).then(() => {
                window.location.href = 'login.html';
            });
        }

        // ============================================================
        // DOCUMENT READY
        // ============================================================

        document.addEventListener('DOMContentLoaded', function () {
            console.log('📚 Book Club - Registration System');
            console.log('Password Security Standard: PK2KF Compliant');
        });
    </script>

</body>

</html>
