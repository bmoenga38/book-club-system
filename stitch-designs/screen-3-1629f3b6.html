<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Blessed Hope Church Library - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-surface-variant": "#45464d",
                        "on-primary-container": "#828eb1",
                        "on-tertiary-fixed-variant": "#3c475d",
                        "background": "#f7f9fc",
                        "on-primary-fixed-variant": "#3a4665",
                        "on-surface": "#191c1e",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#fece65",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#f2f4f7",
                        "inverse-surface": "#2d3133",
                        "inverse-primary": "#b9c6eb",
                        "primary-container": "#1a2744",
                        "tertiary": "#081327",
                        "surface-container": "#eceef1",
                        "surface-bright": "#f7f9fc",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#04122e",
                        "surface": "#f7f9fc",
                        "surface-dim": "#d8dadd",
                        "surface-container-high": "#e6e8eb",
                        "on-secondary-container": "#755700",
                        "on-secondary-fixed-variant": "#5b4300",
                        "on-background": "#191c1e",
                        "outline": "#75777e",
                        "surface-container-highest": "#e0e3e6",
                        "surface-variant": "#e0e3e6",
                        "tertiary-fixed": "#d8e2fe",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#1d283d",
                        "primary-fixed": "#d9e2ff",
                        "primary-fixed-dim": "#b9c6eb",
                        "on-secondary-fixed": "#261a00",
                        "secondary": "#795900",
                        "surface-tint": "#515e7e",
                        "on-tertiary-fixed": "#101b2f",
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#eec058",
                        "inverse-on-surface": "#eff1f4",
                        "secondary-fixed": "#ffdf9f",
                        "on-primary-fixed": "#0d1b37",
                        "on-tertiary-container": "#848fa8",
                        "tertiary-fixed-dim": "#bcc6e1",
                        "outline-variant": "#c5c6ce",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1.25rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .bg-navy-gradient {
            background: linear-gradient(180deg, #1a2744 0%, #0f1a2e 100%);
        }
        .auth-card {
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-navy-gradient min-h-screen flex items-center justify-center p-6 font-body text-on-surface antialiased">
<!-- Login Container -->
<main class="w-full max-w-[400px]">
<!-- White Card -->
<div class="bg-surface-container-lowest rounded-2xl auth-card p-8 flex flex-col items-center">
<!-- Icon/Logo Section -->
<div class="mb-6 flex flex-col items-center">
<div class="w-12 h-12 bg-secondary-fixed rounded-full flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-on-secondary-fixed text-2xl" data-icon="menu_book">menu_book</span>
</div>
<h1 class="text-on-primary-fixed font-headline font-bold text-[28px] leading-tight tracking-tight">Blessed Hope</h1>
<p class="text-on-surface-variant text-[14px] font-medium tracking-wide">Church Library</p>
</div>
<!-- Form Section -->
<form class="w-full space-y-5">
<!-- Phone Input Group -->
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-on-surface-variant/60">
<span class="material-symbols-outlined text-[20px]" data-icon="phone_iphone">phone_iphone</span>
</div>
<input class="w-full h-[52px] pl-12 pr-4 bg-surface-container-highest/30 border border-outline-variant rounded-xl text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary transition-all" placeholder="+254712345678" type="tel"/>
</div>
<!-- Log In Button -->
<button class="w-full h-[52px] bg-secondary-fixed hover:bg-secondary-fixed-dim text-on-secondary-fixed font-bold text-base rounded-xl shadow-[0_4px_12px_rgba(121,89,0,0.15)] flex items-center justify-center transition-all active:scale-[0.98]" type="submit">
                    Log In
                </button>
</form>
<!-- Divider -->
<div class="w-full flex items-center my-8">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="px-4 text-on-surface-variant text-[12px] font-medium uppercase tracking-widest">New member?</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<!-- Register Button -->
<button class="w-full h-[52px] border-2 border-dashed border-outline-variant text-on-primary-fixed font-semibold text-base rounded-xl hover:bg-surface-container-low transition-colors flex items-center justify-center">
                Register Account
            </button>
<!-- Library Context Visual (Hidden on small screens, purely decorative) -->
<div class="mt-8 overflow-hidden rounded-xl w-full aspect-video relative hidden sm:block">
<img alt="Sanctuary library" class="object-cover w-full h-full opacity-20 grayscale" data-alt="atmospheric interior of a modern church library with sunlight streaming through tall windows onto dark wood bookshelves and study tables" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAkHGFDaI8hXsbwlhgXyfXpAQk-7C_z4Kwcevgwx5LNq_t71zLqbSLAMnUFytJD8txklkcfa_oCsY89YZ1zj20pjfxbmAMnDJqbN_8bqGRLAUoHPgQfnQIsJq8MFVnUVc7vZ9FhsBOGpSzQIIhFovBjZK1bbkwlDb5XxWydAG4l6UShFVEAc8U2pYL-6tLTW8woUzunFypSR8HTS5XO7zS4XBy9uoli4m-wkY5aVAn9jD_iCKtAdzMUhQIUdZVezKoC7pEpFeVlYSh9"/>
<div class="absolute inset-0 bg-gradient-to-t from-white via-transparent to-transparent"></div>
</div>
</div>
<!-- Footer -->
<footer class="mt-10 px-4 text-center">
<p class="text-on-primary-container/60 text-[11px] font-medium leading-relaxed max-w-[280px] mx-auto">
                By signing in, you agree to the Blessed Hope Borrowing Policy and Terms of Grace.
            </p>
<!-- Support Link -->
<a class="inline-block mt-4 text-secondary-fixed text-[12px] font-bold hover:underline decoration-secondary-fixed/30 underline-offset-4" href="#">
                Need assistance?
            </a>
</footer>
</main>
<!-- Background Decorative Elements -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 overflow-hidden">
<div class="absolute -top-24 -right-24 w-96 h-96 bg-primary-container rounded-full blur-[120px] opacity-40"></div>
<div class="absolute -bottom-24 -left-24 w-96 h-96 bg-secondary-fixed rounded-full blur-[140px] opacity-10"></div>
</div>
</body></html>
